<!-- @dsCard group="Colors" viewport="700x170" name="Layering model" subtitle="background → layer-01 → layer-02 → layer-03, each nesting one step" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 16px;background:var(--cds-background);font-family:var(--cds-font-sans);color:var(--cds-text-primary)}.g{display:flex;gap:2px}.g>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:4px;box-sizing:border-box;font:400 9px/1.2 var(--cds-font-mono)}.lbl{font:400 11px/16px var(--cds-font-mono);color:var(--cds-text-secondary);letter-spacing:.32px;margin-bottom:6px}.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:1px}.sw>div{height:44px;display:flex;align-items:flex-end;padding:5px;box-sizing:border-box;font:400 10px/1.2 var(--cds-font-mono)}.rows{display:flex;flex-direction:column;gap:10px}.r{display:flex;align-items:baseline;gap:14px}.r i{font:400 11px/16px var(--cds-font-mono);color:var(--cds-text-secondary);width:132px;flex:none;font-style:normal;letter-spacing:.32px}</style></head><body><div style="background:var(--cds-background);padding:10px"><div class="lbl">background</div>
<div style="background:var(--cds-layer-01);padding:10px"><div class="lbl">layer-01 · accent-01 rule below</div><div style="height:4px;background:var(--cds-layer-accent-01)"></div>
<div style="background:var(--cds-layer-02);padding:10px;margin-top:8px"><div class="lbl">layer-02</div>
<div style="background:var(--cds-layer-03);padding:10px"><div class="lbl" style="margin:0">layer-03</div></div></div></div></div></body></html>
