<!-- @dsCard group="Colors" viewport="700x130" name="Tag ramps" subtitle="14 tag families, each with background / color / border / hover" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 16px;background:var(--cds-background);font-family:var(--cds-font-sans);color:var(--cds-text-primary)}.g{display:flex;gap:2px}.g>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:4px;box-sizing:border-box;font:400 9px/1.2 var(--cds-font-mono)}.lbl{font:400 11px/16px var(--cds-font-mono);color:var(--cds-text-secondary);letter-spacing:.32px;margin-bottom:6px}.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:1px}.sw>div{height:44px;display:flex;align-items:flex-end;padding:5px;box-sizing:border-box;font:400 10px/1.2 var(--cds-font-mono)}.rows{display:flex;flex-direction:column;gap:10px}.r{display:flex;align-items:baseline;gap:14px}.r i{font:400 11px/16px var(--cds-font-mono);color:var(--cds-text-secondary);width:132px;flex:none;font-style:normal;letter-spacing:.32px}</style></head><body><div style="display:flex;flex-wrap:wrap;gap:4px"><span style="background:var(--cds-tag-gray-background);color:var(--cds-tag-gray-color);border:1px solid var(--cds-tag-gray-border,transparent);border-radius:100px;padding:2px 10px;font:400 12px/16px var(--cds-font-sans);letter-spacing:.32px">gray</span><span style="background:var(--cds-tag-cool-gray-background);color:var(--cds-tag-cool-gray-color);border:1px solid var(--cds-tag-cool-gray-border,transparent);border-radius:100px;padding:2px 10px;font:400 12px/16px var(--cds-font-sans);letter-spacing:.32px">cool-gray</span><span style="background:var(--cds-tag-warm-gray-background);color:var(--cds-tag-warm-gray-color);border:1px solid var(--cds-tag-warm-gray-border,transparent);border-radius:100px;padding:2px 10px;font:400 12px/16px var(--cds-font-sans);letter-spacing:.32px">warm-gray</span><span style="background:var(--cds-tag-red-background);color:var(--cds-tag-red-color);border:1px solid var(--cds-tag-red-border,transparent);border-radius:100px;padding:2px 10px;font:400 12px/16px var(--cds-font-sans);letter-spacing:.32px">red</span><span style="background:var(--cds-tag-magenta-background);color:var(--cds-tag-magenta-color);border:1px solid var(--cds-tag-magenta-border,transparent);border-radius:100px;padding:2px 10px;font:400 12px/16px var(--cds-font-sans);letter-spacing:.32px">magenta</span><span style="background:var(--cds-tag-purple-background);color:var(--cds-tag-purple-color);border:1px solid var(--cds-tag-purple-border,transparent);border-radius:100px;padding:2px 10px;font:400 12px/16px var(--cds-font-sans);letter-spacing:.32px">purple</span><span style="background:var(--cds-tag-blue-background);color:var(--cds-tag-blue-color);border:1px solid var(--cds-tag-blue-border,transparent);border-radius:100px;padding:2px 10px;font:400 12px/16px var(--cds-font-sans);letter-spacing:.32px">blue</span><span style="background:var(--cds-tag-cyan-background);color:var(--cds-tag-cyan-color);border:1px solid var(--cds-tag-cyan-border,transparent);border-radius:100px;padding:2px 10px;font:400 12px/16px var(--cds-font-sans);letter-spacing:.32px">cyan</span><span style="background:var(--cds-tag-teal-background);color:var(--cds-tag-teal-color);border:1px solid var(--cds-tag-teal-border,transparent);border-radius:100px;padding:2px 10px;font:400 12px/16px var(--cds-font-sans);letter-spacing:.32px">teal</span><span style="background:var(--cds-tag-green-background);color:var(--cds-tag-green-color);border:1px solid var(--cds-tag-green-border,transparent);border-radius:100px;padding:2px 10px;font:400 12px/16px var(--cds-font-sans);letter-spacing:.32px">green</span><span style="background:var(--cds-tag-yellow-background);color:var(--cds-tag-yellow-color);border:1px solid var(--cds-tag-yellow-border,transparent);border-radius:100px;padding:2px 10px;font:400 12px/16px var(--cds-font-sans);letter-spacing:.32px">yellow</span><span style="background:var(--cds-tag-orange-background);color:var(--cds-tag-orange-color);border:1px solid var(--cds-tag-orange-border,transparent);border-radius:100px;padding:2px 10px;font:400 12px/16px var(--cds-font-sans);letter-spacing:.32px">orange</span><span style="background:var(--cds-tag-high-contrast-background);color:var(--cds-tag-high-contrast-color);border:1px solid var(--cds-tag-high-contrast-border,transparent);border-radius:100px;padding:2px 10px;font:400 12px/16px var(--cds-font-sans);letter-spacing:.32px">high-contrast</span><span style="background:var(--cds-tag-outline-background);color:var(--cds-tag-outline-color);border:1px solid var(--cds-tag-outline-border,transparent);border-radius:100px;padding:2px 10px;font:400 12px/16px var(--cds-font-sans);letter-spacing:.32px">outline</span></div></body></html>
