<!-- @dsCard group="Colors" viewport="700x150" name="Button roles" subtitle="Primary/secondary/tertiary/danger fills plus their hover and active steps" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 16px;background:var(--cds-background);font-family:var(--cds-font-sans);color:var(--cds-text-primary)}.g{display:flex;gap:2px}.g>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:4px;box-sizing:border-box;font:400 9px/1.2 var(--cds-font-mono)}.lbl{font:400 11px/16px var(--cds-font-mono);color:var(--cds-text-secondary);letter-spacing:.32px;margin-bottom:6px}.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:1px}.sw>div{height:44px;display:flex;align-items:flex-end;padding:5px;box-sizing:border-box;font:400 10px/1.2 var(--cds-font-mono)}.rows{display:flex;flex-direction:column;gap:10px}.r{display:flex;align-items:baseline;gap:14px}.r i{font:400 11px/16px var(--cds-font-mono);color:var(--cds-text-secondary);width:132px;flex:none;font-style:normal;letter-spacing:.32px}</style></head><body><div class="rows"><div class="r"><i>primary</i><div class="g" style="flex:1"><div style="background:var(--cds-button-primary);color:#fff;height:34px">primary</div><div style="background:var(--cds-button-primary-hover);color:#fff;height:34px">primary-hover</div><div style="background:var(--cds-button-primary-active);color:#fff;height:34px">primary-active</div></div></div><div class="r"><i>secondary</i><div class="g" style="flex:1"><div style="background:var(--cds-button-secondary);color:#fff;height:34px">secondary</div><div style="background:var(--cds-button-secondary-hover);color:#fff;height:34px">secondary-hover</div><div style="background:var(--cds-button-secondary-active);color:#fff;height:34px">secondary-active</div></div></div><div class="r"><i>tertiary</i><div class="g" style="flex:1"><div style="background:var(--cds-button-tertiary);color:#fff;height:34px">tertiary</div><div style="background:var(--cds-button-tertiary-hover);color:#fff;height:34px">tertiary-hover</div><div style="background:var(--cds-button-tertiary-active);color:#fff;height:34px">tertiary-active</div></div></div><div class="r"><i>danger</i><div class="g" style="flex:1"><div style="background:var(--cds-button-danger-primary);color:#fff;height:34px">danger-primary</div><div style="background:var(--cds-button-danger-hover);color:#fff;height:34px">danger-hover</div><div style="background:var(--cds-button-danger-active);color:#fff;height:34px">danger-active</div></div></div></div></body></html>
