<!-- @dsCard group="Colors" viewport="700x140" name="Gray ramp" subtitle="Neutral ramp 10→100, the spine of every Carbon theme" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 16px;background:var(--cds-background);font-family:var(--cds-font-sans);color:var(--cds-text-primary)}.g{display:flex;gap:2px}.g>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:4px;box-sizing:border-box;font:400 9px/1.2 var(--cds-font-mono)}.lbl{font:400 11px/16px var(--cds-font-mono);color:var(--cds-text-secondary);letter-spacing:.32px;margin-bottom:6px}.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:1px}.sw>div{height:44px;display:flex;align-items:flex-end;padding:5px;box-sizing:border-box;font:400 10px/1.2 var(--cds-font-mono)}.rows{display:flex;flex-direction:column;gap:10px}.r{display:flex;align-items:baseline;gap:14px}.r i{font:400 11px/16px var(--cds-font-mono);color:var(--cds-text-secondary);width:132px;flex:none;font-style:normal;letter-spacing:.32px}</style></head><body><div class="lbl">--cds-gray-10 … --cds-gray-100</div><div class="g"><div style="background:var(--cds-gray-10);color:#000">10</div><div style="background:var(--cds-gray-20);color:#000">20</div><div style="background:var(--cds-gray-30);color:#000">30</div><div style="background:var(--cds-gray-40);color:#000">40</div><div style="background:var(--cds-gray-50);color:#fff">50</div><div style="background:var(--cds-gray-60);color:#fff">60</div><div style="background:var(--cds-gray-70);color:#fff">70</div><div style="background:var(--cds-gray-80);color:#fff">80</div><div style="background:var(--cds-gray-90);color:#fff">90</div><div style="background:var(--cds-gray-100);color:#fff">100</div></div></body></html>
