<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 16px;background:var(--cds-background);font-family:var(--cds-font-sans);color:var(--cds-text-primary)}.g{display:flex;gap:2px}.g>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:4px;box-sizing:border-box;font:400 9px/1.2 var(--cds-font-mono)}.lbl{font:400 11px/16px var(--cds-font-mono);color:var(--cds-text-secondary);letter-spacing:.32px;margin-bottom:6px}.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:1px}.sw>div{height:44px;display:flex;align-items:flex-end;padding:5px;box-sizing:border-box;font:400 10px/1.2 var(--cds-font-mono)}.rows{display:flex;flex-direction:column;gap:10px}.r{display:flex;align-items:baseline;gap:14px}.r i{font:400 11px/16px var(--cds-font-mono);color:var(--cds-text-secondary);width:132px;flex:none;font-style:normal;letter-spacing:.32px}</style></head><body><div style="display:flex;align-items:flex-end;gap:10px"><div style="text-align:center"><div style="height:var(--cds-size-xs);width:78px;background:var(--cds-button-primary);color:var(--cds-text-on-color);display:flex;align-items:center;justify-content:center;font:400 12px/16px var(--cds-font-sans)">24px</div><div class="lbl" style="margin:5px 0 0">xs</div></div><div style="text-align:center"><div style="height:var(--cds-size-sm);width:78px;background:var(--cds-button-primary);color:var(--cds-text-on-color);display:flex;align-items:center;justify-content:center;font:400 12px/16px var(--cds-font-sans)">32px</div><div class="lbl" style="margin:5px 0 0">sm</div></div><div style="text-align:center"><div style="height:var(--cds-size-md);width:78px;background:var(--cds-button-primary);color:var(--cds-text-on-color);display:flex;align-items:center;justify-content:center;font:400 12px/16px var(--cds-font-sans)">40px</div><div class="lbl" style="margin:5px 0 0">md</div></div><div style="text-align:center"><div style="height:var(--cds-size-lg);width:78px;background:var(--cds-button-primary);color:var(--cds-text-on-color);display:flex;align-items:center;justify-content:center;font:400 12px/16px var(--cds-font-sans)">48px</div><div class="lbl" style="margin:5px 0 0">lg</div></div><div style="text-align:center"><div style="height:var(--cds-size-xl);width:78px;background:var(--cds-button-primary);color:var(--cds-text-on-color);display:flex;align-items:center;justify-content:center;font:400 12px/16px var(--cds-font-sans)">64px</div><div class="lbl" style="margin:5px 0 0">xl</div></div><div style="text-align:center"><div style="height:var(--cds-size-2xl);width:78px;background:var(--cds-button-primary);color:var(--cds-text-on-color);display:flex;align-items:center;justify-content:center;font:400 12px/16px var(--cds-font-sans)">80px</div><div class="lbl" style="margin:5px 0 0">2xl</div></div></div></body></html>
