<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 16px;background:var(--cds-background);font-family:var(--cds-font-sans);color:var(--cds-text-primary)}.g{display:flex;gap:2px}.g>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:4px;box-sizing:border-box;font:400 9px/1.2 var(--cds-font-mono)}.lbl{font:400 11px/16px var(--cds-font-mono);color:var(--cds-text-secondary);letter-spacing:.32px;margin-bottom:6px}.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:1px}.sw>div{height:44px;display:flex;align-items:flex-end;padding:5px;box-sizing:border-box;font:400 10px/1.2 var(--cds-font-mono)}.rows{display:flex;flex-direction:column;gap:10px}.r{display:flex;align-items:baseline;gap:14px}.r i{font:400 11px/16px var(--cds-font-mono);color:var(--cds-text-secondary);width:132px;flex:none;font-style:normal;letter-spacing:.32px}</style></head><body><div class="rows"><div class="r"><i>300 Light</i><span style="font:300 20px/24px var(--cds-font-sans)">IBM Plex Sans Light</span></div><div class="r"><i>400 Regular</i><span style="font:400 20px/24px var(--cds-font-sans)">IBM Plex Sans Regular</span></div><div class="r"><i>500 Medium</i><span style="font:500 20px/24px var(--cds-font-sans)">IBM Plex Sans Medium</span></div><div class="r"><i>600 SemiBold</i><span style="font:600 20px/24px var(--cds-font-sans)">IBM Plex Sans SemiBold</span></div><div class="r"><i>700 Bold</i><span style="font:700 20px/24px var(--cds-font-sans)">IBM Plex Sans Bold</span></div></div></body></html>
