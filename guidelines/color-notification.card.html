<!-- @dsCard group="Colors" viewport="700x130" name="Notification" subtitle="Inline/toast backgrounds and their 1px left borders" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 16px;background:var(--cds-background);font-family:var(--cds-font-sans);color:var(--cds-text-primary)}.g{display:flex;gap:2px}.g>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:4px;box-sizing:border-box;font:400 9px/1.2 var(--cds-font-mono)}.lbl{font:400 11px/16px var(--cds-font-mono);color:var(--cds-text-secondary);letter-spacing:.32px;margin-bottom:6px}.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:1px}.sw>div{height:44px;display:flex;align-items:flex-end;padding:5px;box-sizing:border-box;font:400 10px/1.2 var(--cds-font-mono)}.rows{display:flex;flex-direction:column;gap:10px}.r{display:flex;align-items:baseline;gap:14px}.r i{font:400 11px/16px var(--cds-font-mono);color:var(--cds-text-secondary);width:132px;flex:none;font-style:normal;letter-spacing:.32px}</style></head><body><div class="rows"><div style="background:var(--cds-notification-error-background);border-left:3px solid var(--cds-notification-error-border);padding:10px 12px;font:400 14px/18px var(--cds-font-sans);letter-spacing:.16px">notification-error</div><div style="background:var(--cds-notification-success-background);border-left:3px solid var(--cds-notification-success-border);padding:10px 12px;font:400 14px/18px var(--cds-font-sans);letter-spacing:.16px">notification-success</div><div style="background:var(--cds-notification-warning-background);border-left:3px solid var(--cds-notification-warning-border);padding:10px 12px;font:400 14px/18px var(--cds-font-sans);letter-spacing:.16px">notification-warning</div><div style="background:var(--cds-notification-info-background);border-left:3px solid var(--cds-notification-info-border);padding:10px 12px;font:400 14px/18px var(--cds-font-sans);letter-spacing:.16px">notification-info</div></div></body></html>
