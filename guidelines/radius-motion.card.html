<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 16px;background:var(--cds-background);font-family:var(--cds-font-sans);color:var(--cds-text-primary)}.g{display:flex;gap:2px}.g>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:4px;box-sizing:border-box;font:400 9px/1.2 var(--cds-font-mono)}.lbl{font:400 11px/16px var(--cds-font-mono);color:var(--cds-text-secondary);letter-spacing:.32px;margin-bottom:6px}.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:1px}.sw>div{height:44px;display:flex;align-items:flex-end;padding:5px;box-sizing:border-box;font:400 10px/1.2 var(--cds-font-mono)}.rows{display:flex;flex-direction:column;gap:10px}.r{display:flex;align-items:baseline;gap:14px}.r i{font:400 11px/16px var(--cds-font-mono);color:var(--cds-text-secondary);width:132px;flex:none;font-style:normal;letter-spacing:.32px}</style></head><body><div style="display:flex;gap:12px;align-items:center"><div style="width:96px;height:44px;background:var(--cds-layer-accent-01);border-radius:var(--cds-radius-none);display:flex;align-items:center;justify-content:center" class="cds-label-01">radius-none</div><div style="width:120px;height:44px;background:var(--cds-layer-accent-01);border-radius:var(--cds-radius-round);display:flex;align-items:center;justify-content:center" class="cds-label-01">radius-round</div></div>
<div class="lbl" style="margin-top:12px">productive cubic-bezier(.2,0,.38,.9) · 70–240ms &nbsp;|&nbsp; expressive cubic-bezier(.4,.14,.3,1) · 400–700ms</div></body></html>
