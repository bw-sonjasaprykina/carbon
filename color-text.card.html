<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 16px;background:var(--cds-background);font-family:var(--cds-font-sans);color:var(--cds-text-primary)}.g{display:flex;gap:2px}.g>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:4px;box-sizing:border-box;font:400 9px/1.2 var(--cds-font-mono)}.lbl{font:400 11px/16px var(--cds-font-mono);color:var(--cds-text-secondary);letter-spacing:.32px;margin-bottom:6px}.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:1px}.sw>div{height:44px;display:flex;align-items:flex-end;padding:5px;box-sizing:border-box;font:400 10px/1.2 var(--cds-font-mono)}.rows{display:flex;flex-direction:column;gap:10px}.r{display:flex;align-items:baseline;gap:14px}.r i{font:400 11px/16px var(--cds-font-mono);color:var(--cds-text-secondary);width:132px;flex:none;font-style:normal;letter-spacing:.32px}</style></head><body><div class="rows"><div style="background:var(--cds-background);padding:5px 8px"><span style="color:var(--cds-text-primary);font:400 14px/18px var(--cds-font-sans);letter-spacing:.16px">--cds-text-primary</span></div><div style="background:var(--cds-background);padding:5px 8px"><span style="color:var(--cds-text-secondary);font:400 14px/18px var(--cds-font-sans);letter-spacing:.16px">--cds-text-secondary</span></div><div style="background:var(--cds-background);padding:5px 8px"><span style="color:var(--cds-text-helper);font:400 14px/18px var(--cds-font-sans);letter-spacing:.16px">--cds-text-helper</span></div><div style="background:var(--cds-background);padding:5px 8px"><span style="color:var(--cds-text-error);font:400 14px/18px var(--cds-font-sans);letter-spacing:.16px">--cds-text-error</span></div><div style="background:var(--cds-field-01);padding:5px 8px"><span style="color:var(--cds-text-placeholder);font:400 14px/18px var(--cds-font-sans);letter-spacing:.16px">--cds-text-placeholder</span></div><div style="background:var(--cds-background);padding:5px 8px"><span style="color:var(--cds-text-disabled);font:400 14px/18px var(--cds-font-sans);letter-spacing:.16px">--cds-text-disabled</span></div>
<div style="background:var(--cds-background-inverse);padding:5px 8px"><span style="color:var(--cds-text-inverse);font:400 14px/18px var(--cds-font-sans)">--cds-text-inverse on background-inverse</span></div></div></body></html>
