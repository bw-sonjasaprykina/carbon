<!-- @dsCard group="Colors" viewport="700x180" name="Support & status" subtitle="Semantic feedback roles — error, success, warning, info, caution" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 16px;background:var(--cds-background);font-family:var(--cds-font-sans);color:var(--cds-text-primary)}.g{display:flex;gap:2px}.g>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:4px;box-sizing:border-box;font:400 9px/1.2 var(--cds-font-mono)}.lbl{font:400 11px/16px var(--cds-font-mono);color:var(--cds-text-secondary);letter-spacing:.32px;margin-bottom:6px}.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:1px}.sw>div{height:44px;display:flex;align-items:flex-end;padding:5px;box-sizing:border-box;font:400 10px/1.2 var(--cds-font-mono)}.rows{display:flex;flex-direction:column;gap:10px}.r{display:flex;align-items:baseline;gap:14px}.r i{font:400 11px/16px var(--cds-font-mono);color:var(--cds-text-secondary);width:132px;flex:none;font-style:normal;letter-spacing:.32px}</style></head><body><div class="sw"><div style="background:var(--cds-support-error);color:#fff">support-error</div><div style="background:var(--cds-support-success);color:#fff">support-success</div><div style="background:var(--cds-support-warning);color:#000">support-warning</div><div style="background:var(--cds-support-info);color:#fff">support-info</div><div style="background:var(--cds-support-caution-major);color:#000">support-caution-major</div><div style="background:var(--cds-support-caution-minor);color:#000">support-caution-minor</div><div style="background:var(--cds-status-red);color:#000">status-red</div><div style="background:var(--cds-status-orange);color:#000">status-orange</div><div style="background:var(--cds-status-yellow);color:#000">status-yellow</div><div style="background:var(--cds-status-green);color:#000">status-green</div><div style="background:var(--cds-status-blue);color:#000">status-blue</div><div style="background:var(--cds-status-purple);color:#000">status-purple</div><div style="background:var(--cds-status-gray);color:#000">status-gray</div><div style="background:var(--cds-support-undefined);color:#fff">support-undefined</div></div></body></html>
