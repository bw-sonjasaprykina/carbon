<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 16px;background:var(--cds-background);font-family:var(--cds-font-sans);color:var(--cds-text-primary)}.g{display:flex;gap:2px}.g>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:4px;box-sizing:border-box;font:400 9px/1.2 var(--cds-font-mono)}.lbl{font:400 11px/16px var(--cds-font-mono);color:var(--cds-text-secondary);letter-spacing:.32px;margin-bottom:6px}.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:1px}.sw>div{height:44px;display:flex;align-items:flex-end;padding:5px;box-sizing:border-box;font:400 10px/1.2 var(--cds-font-mono)}.rows{display:flex;flex-direction:column;gap:10px}.r{display:flex;align-items:baseline;gap:14px}.r i{font:400 11px/16px var(--cds-font-mono);color:var(--cds-text-secondary);width:132px;flex:none;font-style:normal;letter-spacing:.32px}</style></head><body><div style="height:54px;background:linear-gradient(to right,var(--cds-ai-layer-ai-aura-start),var(--cds-ai-layer-ai-aura-end));display:flex;align-items:flex-end;padding:5px;font:400 10px/1.2 var(--cds-font-mono)">ai-aura-start → ai-aura-end</div>
<div style="height:3px;background:linear-gradient(to right,var(--cds-ai-layer-ai-border-start),var(--cds-ai-layer-ai-border-end));margin:2px 0"></div>
<div class="sw"><div style="background:var(--cds-ai-chat-bubble);color:#161616">ai-chat-bubble</div><div style="background:var(--cds-ai-chat-avatar-bot);color:#fff">ai-chat-avatar-bot</div><div style="background:var(--cds-ai-chat-avatar-user);color:#fff">ai-chat-avatar-user</div><div style="background:var(--cds-ai-chat-shell-background);color:#161616">ai-chat-shell-background</div><div style="background:var(--cds-ai-slug-ai-slug-solid-background);color:#fff">ai-slug-ai-slug-solid-background</div><div style="background:var(--cds-ai-layer-ai-border-strong);color:#fff">ai-layer-ai-border-strong</div></div></body></html>
